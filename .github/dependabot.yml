# Dependency version updates, deliberately scoped.
#
# Two related things are enabled in repository SETTINGS rather than here, and this file
# does not control either of them:
#   * Dependabot vulnerability ALERTS — repo-wide, every ecosystem, every dependency,
#     including the four named below. (Automatic security-fix PRs are OFF.)
#   * CodeQL default setup — `actions` + `javascript-typescript`, on push/PR to main.
# What follows governs only the routine "a newer version exists" pull requests.
#
# THE FOUR-DEPENDENCY RULE. It reads as background today because the directory holding
# all four — backend-ts — has no updater at all (see the block below its neighbours), so
# there is no `ignore:` list here enforcing it. It is stated anyway for two reasons: it is
# the standing rule for bumping them BY HAND, and any future backend-ts entry must carry
# these four as ignores on day one.
#
# They are excluded not because updating them is risky in the ordinary sense, but because
# their versions are inputs to numbers this project publishes. A bump that leaves the suite
# green can still make a committed claim untrue:
#
#   @cqframework/cql   translated every committed .elm.json. `compile-measures` is run by
#                      hand, not by CI (issue #410), so a version bump does NOT regenerate
#                      them — the tree would carry ELM from one translator while the
#                      manifest names another. It also produced the CQL language
#                      conformance figures in docs/guide/09-state-and-roadmap.md.
#   cql-execution      together these two ARE the dependency manifest of the published
#   cql-exec-fhir      @work-well/measure-engine. Changing either is a semver event for a
#                      package other people install, and the 1,612-of-1,823 conformance
#                      result was measured against cql-execution 3.3.2 specifically.
#   fqm-execution      runs CMS's published artifacts. The 410/410 MADiE gate was measured
#                      against 1.8.5, which is why it is pinned exact rather than caret.
#                      A bump that moves an expected count fails the gate — that is the
#                      gate working, but it deserves a deliberate re-measure, not a
#                      merge-when-green PR.
#
# All four still raise alerts. Excluding them means an advisory is handled on purpose.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions. The highest-value entry here: the deploy
  # and publish jobs hold real credentials (container registry, Neon, VSAC, npm).
  # Action versions are the part of this supply chain with the widest blast radius
  # and the least routine review.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # backend-ts has NO entry here, and the omission is measured rather than an
  # oversight. Its pnpm workspace takes five `workspace:*` dependencies from
  # `../external/mieweb-cloud/packages/*` — a git SUBMODULE, stored as a bare
  # gitlink. Dependabot's npm updater does not initialize submodules, so it sees an
  # empty directory. Reproduced in a fresh clone with the submodule uninitialized:
  #
  #   $ pnpm -C backend-ts update typescript --lockfile-only
  #   ERR_PNPM_WORKSPACE_PKG_NOT_FOUND  "@mieweb/cli@workspace:*" is in the
  #   dependencies but no package named "@mieweb/cli" is present in the workspace
  #
  # It fails at workspace resolution, before any registry dependency is considered,
  # so an entry here would error on every scheduled run forever. A permanently
  # erroring updater is worse than none: it reads as coverage in the config while
  # proposing nothing.
  #
  # What backend-ts still gets: vulnerability ALERTS, which are repo-wide and owe
  # nothing to this file — demonstrated, not assumed, by the alerts already raised
  # against `backend-ts/pnpm-lock.yaml`. What it does not get: routine version-bump
  # PRs for @aws-sdk/client-s3, better-sqlite3, pg, tsx, typescript and @types/*.
  # Those are bumped by hand.
  #
  # Re-adding this entry requires the workspace to stop depending on submodule
  # members — vendoring @mieweb/cloud, or consuming it from a registry. Do not
  # re-add it on the theory that Dependabot might cope; it was tried.
  # ---------------------------------------------------------------------------
  # frontend has NO entry either. Its updater failed on every weekly run from 2026-09-07
  # ("Skipping next@16.3.5: it doesn't satisfy 16.3.0"), proposing nothing while reading as
  # coverage. `next`/`eslint-config-next` and `react`/`react-dom`/`@types/react*` are exact-pinned
  # PAIRS: bump each pair together, by hand. Dependabot SECURITY updates are off in repository
  # settings, so an alert against the frontend is acted on by hand too.

  # ---------------------------------------------------------------------------
  # wcdb-fhir-shim. The only holder of a MariaDB driver in the repository
  # (ADR-034), and the one package here that speaks to a real database over the
  # network — so `mysql2` is the dependency most worth keeping current.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /wcdb-fhir-shim
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  # ---------------------------------------------------------------------------
  # e2e — Playwright only. The Maui suite runs on every push (not Dependabot's own,
  # which get no VSAC secret), so a bump here is exercised once a person pushes it.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
