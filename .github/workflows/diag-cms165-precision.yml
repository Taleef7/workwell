name: Diagnose CMS165 cross-engine precision (temporary)
on:
  push:
    branches: [diag/cms165-precision]
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend-ts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Fetch official content (pinned commit)
        run: pwsh -NoProfile -File scripts/fetch-official-cases.ps1
      - name: Vendor cms165 terminology, completed from VSAC
        env:
          WORKWELL_VSAC_API_KEY: ${{ secrets.WORKWELL_VSAC_API_KEY_VENDOR }}
        run: pnpm vendor:official --measure CMS165FHIRControllingHighBP --catalog-id cms165 --strip-elm-annotations --with-tests --complete-terminology
      - name: Pin one HAPI image for all three runs
        run: |
          docker pull hapiproject/hapi:latest
          echo "HAPI_IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' hapiproject/hapi:latest)" >> "$GITHUB_ENV"
      - name: Build the mutated bundle (only the 30 June 23:59:59.000 onsets move to 12:00 the same day)
        run: |
          B=.official-content/bundles/measure/CMS165FHIRControllingHighBP/CMS165FHIRControllingHighBP-bundle.json
          node -e '
            const fs=require("fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));let n=0;
            for(const e of b.entry){const r=e.resource;if(r.resourceType==="Condition"&&typeof r.onsetDateTime==="string"&&r.onsetDateTime.startsWith("2026-06-30T23:59:59.000")){r.onsetDateTime=r.onsetDateTime.replace("23:59:59.000","12:00:00.000");n++;}}
            fs.writeFileSync(process.argv[2],JSON.stringify(b));console.log("onsets moved:",n);' "$B" "$RUNNER_TEMP/cms165-mutated.json"
      - name: "D: keep the server, then read the raw report for case 45e01fed"
        run: |
          bash scripts/cross-engine-sweep.sh cms165 --keep -- --json > "$RUNNER_TEMP/D.json" || true
          P=45e01fed-56bb-483d-a860-af3d566bda11
          mkdir -p ../diag-out
          for q in "periodStart=2026-01-01&periodEnd=2026-12-31" ""; do
            curl -s "http://localhost:8899/fhir/Measure/CMS165FHIRControllingHighBP/\$evaluate-measure?subject=Patient/$P&reportType=subject${q:+&$q}" > "../diag-out/raw-${q:+period}${q:-noperiod}.json"
          done
          for f in ../diag-out/raw-*.json; do
            echo "== $f"
            jq -c '{populations:[.group[0].population[]|{c:.code.coding[0].code,n:.count}], contained:[.contained[]?|{t:.resourceType, issue:[.issue[]?|{s:.severity,d:(.details.text // .diagnostics // "")[0:400]}]}], ext:[.extension[]?|.url|split("/")|last]}' "$f"
          done
          curl -s "http://localhost:8899/fhir/MedicationRequest?subject=Patient/$P" | jq -c '[.entry[]?.resource|{id, med:(.medicationReference // .medicationCodeableConcept), status, intent}]'
          curl -s "http://localhost:8899/fhir/Medication?_count=5" | jq -c '[.entry[]?.resource|{id, code:.code.coding[0].code}]'
          docker rm -f hapi-cr >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cms165-precision
          path: diag-out/
