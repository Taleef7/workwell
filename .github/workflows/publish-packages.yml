# Publishes the `@work-well/*` packages to npm with provenance (roadmap M-C / C4, ADR-063).
#
# INERT UNTIL AN OWNER ACTS, deliberately. It is `workflow_dispatch` only — never a push or tag
# trigger — and it defaults to a dry run. Publishing is irreversible in a way nothing else in this
# repo is: npm permits unpublish only within 72 hours and never permits reusing a version number, so a
# mistake here cannot be fixed by a revert commit the way a bad deploy can (DEPLOY.md rollback).
#
# FIRST PUBLISH DONE (2026-08-07): `@work-well/measure-engine@0.1.0` and `@work-well/measure-codegen@0.1.0`
# are on the public registry with SLSA provenance. Re-running this workflow at an unchanged version will
# FAIL — npm never permits reusing a version number — so bump the version first (see the semver policy in
# `docs/PACKAGES.md`; pre-1.0, removals and semantic changes take the MINOR).
#
# Two things learned on that first run, both of which will mislead you otherwise:
#   * The DRY RUN never exercises `NPM_TOKEN` — it stops before the publish step. A mis-scoped token
#     passes the dry run and fails the real one.
#   * The registry is NOT immediately consistent. `npm view` 404'd for several minutes after a publish
#     that had already succeeded and signed provenance. Read the log for `+ @work-well/<pkg>@<version>`
#     rather than concluding from an early 404 that nothing was published.
#
# The scope is `@work-well`, not `@workwell`: an unrelated unscoped package named `workwell` already
# exists on npm, and npm refuses an org name that collides with an existing package name (ADR-063
# amendment). Hyphen over underscore is npm convention.
#
# OWNER STEPS for a SUBSEQUENT release:
#   0. Bump the version in the package's `package.json` and merge that first.
#      You do NOT have to match `packages:` to what you bumped — the publish step derives that by
#      asking the registry, skips anything already released at its current version, and FAILS if that
#      leaves nothing to publish. Leaving it on `all` is the safe default.
#   1. Run this workflow with `dry_run: true` and read the packed file lists in the log.
#   2. Re-run with `dry_run: false`.
#
# NOTE the dry run does NOT exercise `NPM_TOKEN` — it stops before the publish step. A token whose
# scope selection does not cover `@work-well` will therefore pass the dry run and fail the real one.
# That is a deliberate trade (the dry run must not be able to publish), not an oversight.
#
# What is independently verified, on every PR, is the harder half: the tarballs build, install, run and
# typecheck outside the workspace — `pnpm verify:publish`, CI's `packages` job.
#
# Provenance (`publishConfig.provenance: true` in each manifest) needs `id-token: write` below and a
# public repository; it attests which commit, workflow and runner produced the tarball, so a consumer
# can verify the package against this source rather than trusting the registry.
name: Publish packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate only — do not publish"
        type: boolean
        default: true
      packages:
        description: "Which packages to publish"
        type: choice
        default: all
        options: [all, measure-engine, measure-codegen]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-ts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: backend-ts/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # A package is not publishable because it packs — it is publishable because the code in it is
      # the code CI gates. Typecheck and the full suite run here too rather than being inferred from
      # a green run on the merge commit, since this workflow can be dispatched from any ref.
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

      # The real gate: build the tarballs and consume them from a directory outside this workspace.
      - name: Verify the tarballs outside the workspace
        run: pnpm verify:publish

      - name: Refuse to publish without a token
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. See the owner steps in .github/workflows/publish-packages.yml."
            exit 1
          fi

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          selected='${{ inputs.packages }}'
          if [ "${selected}" = "all" ]; then
            targets="measure-engine measure-codegen"
          else
            targets="${selected}"
          fi

          # WHICH packages publish is DERIVED from what the registry already has, not from the operator
          # picking correctly. Once both packages exist, a release that bumps only one and runs with the
          # default `all` is a coin flip on an irreversible path: in one order the engine publishes and
          # then codegen fails on its unchanged version, leaving a HALF-DONE release; in the other the
          # engine fails first and `set -e` aborts before codegen, so a valid release publishes NOTHING.
          # Both are the workflow's fault, not the operator's, so the workflow fixes it.
          #
          # A skip is announced, never silent — "I ran the release and nothing happened" must not be a
          # thing an operator can believe by accident.
          published=0
          skipped=""
          for pkg in ${targets}; do
            name="@work-well/${pkg}"
            version="$(node -p "require('./packages/${pkg}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "--- SKIP ${name}@${version}: already on the registry (npm never permits reusing a version)"
              skipped="${skipped} ${name}@${version}"
              continue
            fi
            echo "--- publishing ${name}@${version}"
            # --no-git-checks: the workflow may be dispatched from a ref pnpm considers unclean
            # (a tag, a detached head). The provenance attestation records the real commit either way,
            # so the check adds nothing here that the attestation does not already state.
            pnpm --filter "${name}" publish --no-git-checks --access public
            published=$((published + 1))
          done

          # Nothing to publish is an ERROR, not a quiet success: it means every selected package is
          # already released at its current version, which almost always means a forgotten version bump.
          if [ "${published}" -eq 0 ]; then
            echo "::error::Nothing was published — every selected package is already on the registry at its current version (${skipped# }). Bump the version first; see docs/PACKAGES.md §3."
            exit 1
          fi
          echo "published=${published}" >> "$GITHUB_ENV"
          echo "skipped=${skipped# }" >> "$GITHUB_ENV"

      - name: Say what happened
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry run — nothing was published" >> "$GITHUB_STEP_SUMMARY"
          else
            # Reports what was PUBLISHED and what was SKIPPED, rather than echoing the selector back.
            # "Published `all`" would be a lie on any run where a package was already at its version.
            echo "### Published ${published:-0} package(s) to npm with provenance" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${skipped:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Skipped (already on the registry at this version): \`${skipped}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
