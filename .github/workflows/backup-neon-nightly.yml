# Nightly logical backup of the live Neon databases (#270 / docs/BACKUP_DR_RUNBOOK.md §2 decision 2).
#
# Each live Neon project's PITR window is plan-capped at SIX HOURS (Free plan maximum — verified
# 2026-07-14), and until this workflow existed retention was the ONLY recovery mechanism. This adds
# the second line of defence: a nightly `pg_dump` of the `workwell_spike` schema to object storage,
# giving a recovery path independent of Neon retention AND independent of Neon itself.
#
# TWO STACKS since 2026-09-11 (#473). The pilot deployment has carried 20,000 patients since
# 2026-09-06 and had NO backup workflow at all — this job named DATABASE_URL_TWH and nothing else.
# A matrix leg per stack is deliberately preferred over a second workflow file: a copy drifts from
# its original, and the drift stays invisible until the day you need the dump.
#
# STORAGE IS CLOUDFLARE R2 since 2026-09-11 (#473). The former AWS bucket sat on a Free Plan account
# that expired 2026-08-24 exactly as docs/DEPLOY.md warned; AWS suspended it, every key stopped
# authenticating, and this job failed seventeen consecutive nights while S3 answered
# `AllAccessDisabled`. R2 has no expiry clock, is S3-compatible (so `--endpoint-url` is the only
# change to the upload), and its free tier covers this workload. TWO BUCKETS, not one bucket with
# prefix policies: R2 scopes an API token per BUCKET, so `workwell-backups` and the app's
# `workwell-evidence-twh` carry separate tokens and the app's credentials cannot reach the dumps at
# all — strictly stronger than the IAM prefix deny it replaces.
#
# Restore (see BACKUP_DR_RUNBOOK.md §3): download a dump, `pg_restore -d <target> --no-owner
# --schema=workwell_spike <file>` into a fresh Neon project/branch, repoint the stack's DATABASE_URL.
name: backup-neon-nightly

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC — off the :00 spike, after the scheduler's daily run window
  workflow_dispatch:

permissions:
  contents: read
  # Raise an issue when the dump fails. This job is the only always-on process that opens a REAL
  # connection to the REAL database every day, which makes it our de-facto database health check —
  # the 15-minute self-heal reconciler probes /actuator/health, which is deliberately DB-free and
  # therefore cannot detect a database outage (see docs/DEPLOY.md → "Database compute cost").
  issues: write

jobs:
  dump:
    name: pg_dump ${{ matrix.stack }} → R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One stack's failure must not cancel the other's dump. A dead TWH database is not a reason to
    # skip the pilot's backup — and before this matrix existed, the pilot had no backup to skip.
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: twh
            db_secret: DATABASE_URL_TWH
            prefix: db-dumps/twh
            # The legacy title, kept EXACTLY. Issue #473 has been raised under it every night since
            # 2026-08-25, and this job's success step closes by title — a reworded title would leave
            # #473 open forever and silently open a second one beside it.
            issue_title: "Nightly Neon backup is failing"
          - stack: maui
            db_secret: DATABASE_URL_MAUI
            prefix: db-dumps/maui
            issue_title: "Nightly Neon backup is failing (Maui pilot)"
    concurrency:
      group: backup-neon-nightly-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      # A STATIC secret reference per leg, chosen by a conditional — not `secrets[matrix.db_secret]`.
      # Dynamic indexing of the secrets context reads, to CodeQL and to a human, as "this job may
      # touch any secret in the repository", because nothing in the expression says which one it
      # resolves to (alert: Excessive Secrets Exposure). The ternary names both, so the set a leg can
      # reach is visible here rather than inferred from the matrix twenty lines above.
      DATABASE_URL: ${{ matrix.stack == 'twh' && secrets.DATABASE_URL_TWH || secrets.DATABASE_URL_MAUI }}
      # A DEDICATED backup principal: an R2 API token scoped to the `workwell-backups` bucket alone.
      AWS_ACCESS_KEY_ID: ${{ secrets.WORKWELL_BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKWELL_BACKUP_S3_SECRET_ACCESS_KEY }}
      # R2 ignores the region, but SigV4 refuses to sign without one; `auto` is R2's documented value.
      AWS_DEFAULT_REGION: auto
      # aws-cli >= 2.23 sends `x-amz-checksum-crc32` by default, which has historically broken
      # MULTIPART uploads to R2 — and the pilot's dump is already 31.8 MiB, well past the 8 MiB
      # multipart threshold. The runner image's aws-cli bumps silently, so pin Cloudflare's
      # documented workaround rather than wait to be surprised by it at 03:17 UTC.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BACKUP_BUCKET: workwell-backups
      # A secret rather than a literal: this repository is PUBLIC and the endpoint embeds the
      # Cloudflare account id.
      BACKUP_ENDPOINT: ${{ secrets.WORKWELL_R2_S3_ENDPOINT }}
      # The secret's NAME, as a plain label for error messages — "DATABASE_URL_MAUI is empty" is
      # actionable where "the database url is empty" is not. It no longer looks the secret up; see the
      # static ternary above.
      DB_SECRET_NAME: ${{ matrix.db_secret }}
      STACK: ${{ matrix.stack }}
      DUMP_PREFIX: ${{ matrix.prefix }}
    steps:
      - name: Validate required secrets
        run: |
          missing=()
          [ -z "$DATABASE_URL" ] && missing+=("$DB_SECRET_NAME")
          [ -z "$AWS_ACCESS_KEY_ID" ] && missing+=("WORKWELL_BACKUP_S3_ACCESS_KEY_ID")
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && missing+=("WORKWELL_BACKUP_S3_SECRET_ACCESS_KEY")
          [ -z "$BACKUP_ENDPOINT" ] && missing+=("WORKWELL_R2_S3_ENDPOINT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Ensure pg_dump 16+
        # The Neon server is Postgres 16; pg_dump's major version must be >= the server's.
        run: |
          ok() { pg_dump --version | grep -qE ' (1[6-9]|[2-9][0-9])\.'; }
          if ! ok; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          fi
          pg_dump --version
          if ! ok; then
            echo "::error::pg_dump is still older than 16 after install — dump would fail against the PG16 server." >&2
            exit 1
          fi

      - name: Dump the workwell_spike schema
        run: |
          # The DATABASE_URL secrets are JDBC URLs (jdbc:postgresql://...) — strip the prefix for
          # libpq, exactly as the deploy workflows do. pg_dump must NOT go through the transaction
          # pooler, so also strip Neon's `-pooler` host infix for a direct connection.
          db_url="${DATABASE_URL#jdbc:}"
          case "$db_url" in
            postgres://*|postgresql://*) : ;;
            *)
              echo "::error::${DB_SECRET_NAME} must be a postgres:// or jdbc:postgresql:// URL." >&2
              exit 1
              ;;
          esac
          # Anchor the -pooler strip to the HOST portion (first '-pooler.' after the '@'), so a
          # password that happens to contain '-pooler.' is never corrupted (review P3-3).
          direct_url="$(printf '%s' "$db_url" | sed 's/@\([^/@]*\)-pooler\./@\1./')"
          # The JDBC URL uses camelCase query params; libpq wants snake_case (pg_dump rejects
          # "channelBinding" outright — first live run 2026-07-14).
          direct_url="${direct_url/channelBinding=/channel_binding=}"
          pg_dump "$direct_url" --schema=workwell_spike --format=custom --no-owner \
            --file=workwell_spike.dump
          ls -l workwell_spike.dump

      - name: Upload to R2 (30-day lifecycle on db-dumps/)
        run: |
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          key="${DUMP_PREFIX}/workwell_spike-${stamp}.dump"
          aws s3 cp workwell_spike.dump "s3://${BACKUP_BUCKET}/${key}" \
            --endpoint-url "$BACKUP_ENDPOINT"
          bytes="$(stat -c%s workwell_spike.dump)"
          echo "Uploaded s3://${BACKUP_BUCKET}/${key} (${bytes} bytes)"
          # On the run summary because the free tier is 10 GB and the window is 30 nightly dumps PER
          # STACK: this size is the number that decides whether 30 days actually fits.
          {
            echo "### ${STACK}: $(numfmt --to=iec --suffix=B "$bytes")"
            echo ""
            echo "\`s3://${BACKUP_BUCKET}/${key}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Make a failure impossible to miss (2026-07-22 incident).
      #
      # This job failed five nights running (07-18 → 07-22) while the database was quota-blocked and
      # nobody noticed, because a red scheduled workflow is invisible unless you go looking. It had
      # correctly detected a total production outage on night one. Detection was never the gap —
      # notification was. So: surface it as an open issue, and close it automatically on recovery.
      #
      # Deliberately ONE issue per stack that gets commented on, not a new issue per night — a nightly
      # pile of duplicates is just a different flavour of noise nobody reads.
      # ---------------------------------------------------------------------
      - name: Open or update the backup-failure issue
        if: failure()
        # NO continue-on-error here, deliberately. This step only runs when the dump has ALREADY
        # failed, so it cannot turn a good run red — and suppressing its failure would hide the
        # alerting path breaking, which is the same shape as the outage this workflow exists to
        # report. If raising the issue fails, that must be visible in the step status.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks out the repo, so gh has no local git remote to infer the
          # repository from and would exit before it could raise anything — an alerting step that
          # silently fails is worse than none. GH_REPO supplies that context explicitly.
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ matrix.issue_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The search term is QUOTED into an exact phrase. Unquoted, GitHub treats each word as a
          # separate keyword — so "Nightly Neon backup is failing (Maui pilot)" becomes a bag of
          # common words that can rank the issue we want outside the page we asked for. --limit 100
          # because gh defaults to 30, for the same reason: the exact-title `select` is what keeps the
          # two stacks off each other's issues (the TWH title is a PREFIX of the Maui one), and a
          # select cannot match a row the search never returned.
          existing="$(gh issue list --state open --search "\"$TITLE\" in:title" --limit 100 \
            --json number,title --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing — [run ${GITHUB_RUN_ID}](${RUN_URL}) at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo "Commented on existing issue #${existing}"
          else
            gh issue create --title "$TITLE" --body "$(cat <<EOF
          The nightly \`pg_dump\` of \`workwell_spike\` on the **${STACK}** stack failed: [run ${GITHUB_RUN_ID}](${RUN_URL}).

          **Treat this as a production incident, not a backup problem.** This job is the only always-on
          process that opens a real connection to the real database, so it is our de-facto database
          health check. The 15-minute self-heal reconciler probes \`/actuator/health\`, which is
          deliberately DB-free and **cannot** detect a database outage — do not "fix" that by adding a
          query to it, or the reconciler becomes a compute-pinning loop (see \`docs/DEPLOY.md\` →
          "Database compute cost").

          Most likely causes, in order:

          1. **Database unreachable** — check the Neon console. A \`402\` in the run log means the compute
             quota is exhausted and *every* DB-backed route is already returning \`internal_error\`.
          2. A rotated or expired DATABASE_URL for this stack, or a revoked R2 backup token.
          3. **Object storage refusing the credential.** \`AllAccessDisabled\` or \`InvalidAccessKeyId\`
             in the upload step means the storage account or token is gone, not the database — that is
             what took this job down for seventeen nights from 2026-08-25 (#473).
          4. \`pg_dump\` version drift against the server.

          Quick check — if this returns 500s, the live site is down:

          \`\`\`bash
          curl -s -o /dev/null -w '%{http_code}\n' https://${STACK}-api-ts.os.mieweb.org/api/version
          \`\`\`

          This issue closes automatically on the next successful backup of this stack.
          EOF
          )"
            echo "Opened a new backup-failure issue"
          fi

      - name: Close the backup-failure issue on recovery
        if: success()
        # continue-on-error HERE only: this step runs after a dump that SUCCEEDED, and it runs under
        # `set -euo pipefail`, so a transient `gh` 502 would otherwise mark the job failed and — since
        # `if: failure()` on the step above was already evaluated and skipped — produce a red run with
        # no issue activity, which reads as "the backup broke" when the dump is safely in the bucket.
        # Tidying the issue tracker must not be able to lie about whether the backup happened.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See the failure step above: no checkout, so gh needs the repository given to it.
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ matrix.issue_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The search term is QUOTED into an exact phrase. Unquoted, GitHub treats each word as a
          # separate keyword — so "Nightly Neon backup is failing (Maui pilot)" becomes a bag of
          # common words that can rank the issue we want outside the page we asked for. --limit 100
          # because gh defaults to 30, for the same reason: the exact-title `select` is what keeps the
          # two stacks off each other's issues (the TWH title is a PREFIX of the Maui one), and a
          # select cannot match a row the search never returned.
          #
          # ALL matching numbers here (the failure step takes only the first, because it needs one
          # thread to comment on).
          existing="$(gh issue list --state open --search "\"$TITLE\" in:title" --limit 100 \
            --json number,title --jq "[.[] | select(.title == env.TITLE)] | .[].number")"
          if [ -n "$existing" ]; then
            # EVERY matching issue, not just the first. Duplicates can exist — opened by hand, or by
            # an earlier run whose search missed the original — and closing one of them on recovery
            # leaves the rest open forever, which is a standing false alarm that trains people to
            # ignore the real one.
            for number in $existing; do
              gh issue close "$number" --comment "Recovered — backup succeeded in [run ${GITHUB_RUN_ID}](${RUN_URL})."
              echo "Closed issue #${number}"
            done
          else
            echo "No open backup-failure issue; nothing to close."
          fi
