name: Diagnose translation library conformance (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deqm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend-ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend-ts/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Fetch the HL7 validator
        run: |
          curl -sSL -o "$RUNNER_TEMP/validator_cli.jar" https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
          java -jar "$RUNNER_TEMP/validator_cli.jar" -version 2>&1 | head -3 || true
      - name: Extract CMS122 Library + Measure (upstream full, our vendored, our translation)
        run: |
          pwsh -NoProfile -File scripts/fetch-official-cases.ps1 >/dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/lib"
          node -e '
            const fs=require("fs");const out=process.argv[1];
            const src={upstream:".official-content/bundles/measure/CMS122FHIRDiabetesAssessGT9Pct/CMS122FHIRDiabetesAssessGT9Pct-bundle.json",vendored:"measures/official/cms122/bundle.json",translation:"measures/derived/cms122/bundle.json"};
            for(const [k,p] of Object.entries(src)){const b=JSON.parse(fs.readFileSync(p,"utf8"));const rs=b.entry.map(e=>e.resource);
              const M=rs.find(r=>r.resourceType==="Measure");const L=rs.find(r=>r.resourceType==="Library"&&(M.library||[]).some(u=>u.split("|")[0]===r.url));
              for(const [t,r] of [["Library",L],["Measure",M]]){fs.writeFileSync(`${out}/${k}-${t}.json`,JSON.stringify(r));console.log(k,t,r.url,r.version,(r.content||[]).map(c=>c.contentType).join(","));}}' "$RUNNER_TEMP/lib"
      - name: Validate against the profiles each resource claims
        run: |
          for f in "$RUNNER_TEMP"/lib/*.json; do
            echo "=================== $(basename "$f")"
            java -jar "$RUNNER_TEMP/validator_cli.jar" "$f" -version 4.0.1 -ig hl7.fhir.uv.crmi -ig hl7.fhir.uv.cql -ig hl7.fhir.us.cqfmeasures -tx n/a 2>&1 \
              | grep -E "^\s*(Error|Warning) @|^(Success|\*FAILURE\*)|Package Summary" \
              | sed -E 's/\(line [0-9]+, col[0-9]+\)//; s/\[[0-9]+\]/[n]/g' | sort | uniq -c | sort -rn | head -30
          done
