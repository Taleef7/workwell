name: Diagnose DEQM 1.0.0 gap (temporary)
on:
  push:
    branches: [diag/convert-days]
permissions:
  contents: read
jobs:
  deqm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend-ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend-ts/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Fetch the HL7 validator
        run: |
          curl -sSL -o "$RUNNER_TEMP/validator_cli.jar" https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
          java -jar "$RUNNER_TEMP/validator_cli.jar" -version 2>&1 | head -3 || true
      - name: Against Da Vinci DEQM STU5 (the documented baseline)
        run: pnpm exec tsx scripts/deqm-validate.ts --validator "$RUNNER_TEMP/validator_cli.jar" --out "$RUNNER_TEMP/stu5" | grep -v "^\s*$"
      - name: Against DEQM 1.0.0 (UV)
        env:
          DEQM_IG: hl7.fhir.uv.deqm#1.0.0
          DEQM_P: http://hl7.org/fhir/uv/deqm/StructureDefinition
          DEQM_SUMMARY: deqm-summarymeasurereport
          DEQM_INDIVIDUAL: deqm-individualmeasurereport
        run: pnpm exec tsx scripts/deqm-validate.ts --validator "$RUNNER_TEMP/validator_cli.jar" --out "$RUNNER_TEMP/uv1" | grep -v "^\s*$"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deqm-validate
          path: |
            ${{ runner.temp }}/stu5
            ${{ runner.temp }}/uv1
