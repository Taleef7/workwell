name: Diagnose sort ties on the Java engine (temporary)
on:
  push:
    branches: [diag/convert-days]
permissions:
  contents: read
jobs:
  sortcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start HAPI (cqf-fhir-cr), pinned digest
        run: |
          docker run -d --name hapi-cr -p 8899:8080 \
            -e hapi.fhir.fhir_version=R4 -e hapi.fhir.cr.enabled=true \
            hapiproject/hapi@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8899/fhir/metadata -o meta.json && grep -q '"evaluate-measure"' meta.json; then echo ready; break; fi; sleep 5; done
          echo "operations declared:"; jq -r '[.. | objects | select(has("definition") and has("name")) | .name] | unique | join(" ")' meta.json
      - name: Run SortCheck.cql through $cql
        run: |
          CQL="$(cat .github/diag/SortCheck.cql)"
          jq -n --arg c "$CQL" '{resourceType:"Parameters",parameter:[{name:"content",valueString:$c}]}' > p.json
          curl -s -X POST -H 'Content-Type: application/fhir+json' --data @p.json "http://localhost:8899/fhir/\$cql" -o out.json -w "HTTP %{http_code}\n"
          jq -c '.parameter[]? | {name, v: (.valueString // .valueInteger // .valueDecimal // .valueDateTime // .valueBoolean // .resource.resourceType // (.part|tostring))}' out.json || cat out.json
      - name: Fallback, Library/$evaluate
        if: always()
        run: |
          B64="$(base64 -w0 .github/diag/SortCheck.cql)"
          jq -n --arg d "$B64" '{resourceType:"Library",id:"SortCheck",url:"http://example.org/Library/SortCheck",name:"SortCheck",version:"1.0.0",status:"active",type:{coding:[{system:"http://terminology.hl7.org/CodeSystem/library-type",code:"logic-library"}]},content:[{contentType:"text/cql",data:$d}]}' > lib.json
          curl -s -X PUT -H 'Content-Type: application/fhir+json' --data @lib.json http://localhost:8899/fhir/Library/SortCheck -o /dev/null -w "PUT %{http_code}\n"
          curl -s -X POST -H 'Content-Type: application/fhir+json' --data '{"resourceType":"Parameters"}' "http://localhost:8899/fhir/Library/SortCheck/\$evaluate" -o ev.json -w "HTTP %{http_code}\n"
          jq -c '.parameter[]? | {name, v: (.valueString // .valueInteger // .valueDecimal // .valueDateTime // .valueBoolean // .resource.resourceType // (.part|tostring))}' ev.json || cat ev.json
      - name: Container log tail on failure
        if: failure()
        run: docker logs hapi-cr 2>&1 | tail -80
