services:
  mongodb:
    image: mongo:8.0.9
    volumes:
      - cvu-mongo-data:/data/db
    restart: unless-stopped

  cqm-execution-service:
    image: mitrehealthdocker/cqm-execution-service:latest
    platform: linux/amd64
    restart: unless-stopped

  cypress:
    image: workwell/cypress-round1:v7.5.1
    platform: linux/amd64
    depends_on:
      - mongodb
      - cqm-execution-service
    ports:
      - "3000:3000"
    volumes:
      - cvu-cypress-data:/app/public/data
    environment:
      MONGO_PORT_27017_TCP_ADDR: mongodb
      MONGO_PORT_27017_TCP_PORT: "27017"
      CQM_EXECUTION_SERVICE_HOST: cqm-execution-service
      SECRET_KEY_BASE: "${CYPRESS_SECRET_KEY_BASE:?set a local-only CYPRESS_SECRET_KEY_BASE}"
      RAILS_ENV: production
      PORT: "3000"
      WEB_CONCURRENCY: "1"
    restart: unless-stopped

volumes:
  cvu-cypress-data:
  cvu-mongo-data:
