# backend-ts is its own self-contained pnpm workspace so it can consume the
# @mieweb/cloud packages from the `mieweb/cloud` git submodule WITHOUT turning
# the WorkWell repo root into a workspace (frontend/ + backend/ stay untouched).
#
# The submodule packages use `workspace:*` for their own internal deps, so they
# must be resolved as workspace members here (a plain `file:` link would break
# those internal `workspace:*` references). Including them as members below lets
# pnpm resolve the whole @mieweb/cloud graph from source.
#
# `packages/*` are WorkWell's own extractable libraries (roadmap M-C).
#   @work-well/official-executor — the fqm-execution quarantine (ADR-026).
#   @work-well/measure-engine    — the eval core, content-free (ADR-059).
#   @work-well/measure-codegen   — rule → CQL, zero deps, authoring-time only (ADR-062).
#   @work-well/example-consumer  — proves the engine runs on content that is not ours (ADR-062).
packages:
  - "."
  - "packages/*"
  - "../external/mieweb-cloud/packages/*"

# pnpm settings live here, not in package.json's `pnpm` field: pnpm 11 (which Dependabot runs) ignores
# that field, so its lockfiles dropped the override and the patch and failed `--frozen-lockfile`.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

overrides:
  better-sqlite3: ^12.0.0
  # Security floors (2026-10-17) for packages fqm-execution 1.8.5 and @mieweb/cloud pin below their fixes:
  # handlebars (two critical: JavaScript injection in compile), axios (high: prototype pollution, ReDoS,
  # HTTP/2 DoS), moment (path traversal), hono (several mediums). Each stays within the major its dependents
  # declare. fqm-execution's numbers are re-proved by CI's MADiE gate; drop a floor once its parent ships it.
  # hono is only an auto-installed peer of @hono/node-server: a lockfile that already holds an older one keeps
  # it until that snapshot is re-resolved.
  handlebars: ^4.7.10
  axios: ^1.20.0
  moment: ^2.31.0
  hono: ^4.13.7

patchedDependencies:
  cql-execution@3.3.2: patches/cql-execution@3.3.2.patch
